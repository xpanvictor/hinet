[package]
name = "net"
version = "0.1.0"
edition = "2024"

[dependencies]
common = {path = "../../crates/common"}
message ={ path = "../../crates/message"}
tokio = {version = "1.48.0", features = ["full"]}
tokio-util = { version = "0.7.16", features = ["codec"] }
futures = "0.3.31"
tracing = "0.1.41"
anyhow = "1.0.100"
bytes = "1.10.1"
libp2p = { version = "0.56.0", features = [
    "tokio", "cbor", "dns", "kad", "noise", "macros", "request-response",
    "tcp", "websocket", "identify", "gossipsub", "autonat", "yamux",
    "ping", "mdns", "dcutr", "relay"
    ] }
